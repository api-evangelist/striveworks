method: searched
source: >-
  https://production.chariot.striveworks.us/docs/sdk/sdk ; https://pypi.org/project/valor-lite/ ;
  https://github.com/Striveworks
summary: >-
  Striveworks ships one first-party API client SDK — the Chariot Python SDK (`chariot-client`), which
  also installs the `chariot` CLI — but distributes it from each customer's own Chariot deployment and
  from the bundled Armory registry rather than from public PyPI. The one Striveworks library published
  to a public registry is `valor-lite`, their open-source ML evaluation library. No first-party client
  library was found on npm, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist or crates.io.
packages:
  - language: python
    registry: chariot-instance
    name: chariot-client
    url: https://production.chariot.striveworks.us/docs/sdk/sdk
    install: pip install https://<chariot_host>/docs/static/chariot_client-0.26.2-py3-none-any.whl
    official: true
    role: api-client
    ships_cli: chariot
    api_docs: https://production.chariot.striveworks.us/docs/sdk_api_docs/index.html
    notes: >-
      High-level programmatic access to Chariot services. Not published to public PyPI; the wheel is
      served by each Chariot deployment at /docs/static/ and pre-releases are pulled from the Armory,
      Chariot's bundled read-only Python/NPM registry. Pre-installed in Chariot Workspaces.
  - language: python
    registry: pypi
    name: valor-lite
    url: https://pypi.org/project/valor-lite/
    install: pip install valor-lite
    official: true
    role: library
    version_observed: 0.37.7
    requires_python: '>=3.10'
    source_code: https://github.com/Striveworks/valor
    docs: https://striveworks.github.io/valor/
    notes: >-
      Lightweight numpy-based library for fast evaluation of machine learning models, maintained by
      Striveworks. Project homepage on PyPI is https://www.striveworks.com, which is how first-party
      ownership was confirmed. Not a Chariot API client.
  - language: python
    registry: github
    name: blueprint-toolkit
    url: https://github.com/Striveworks/blueprint-toolkit
    install: null
    official: true
    role: library
    notes: >-
      Toolkit for training Striveworks blueprints. Published as source on GitHub only; no public
      registry release was found.
