summary: >-
  Chariot's cross-cutting standards posture, read from the published documentation. The platform's
  strongest conformance signals are on the inference side — it implements and names the KServe v2 /
  Open Inference Protocol and an OpenAI-compatible protocol — and on auth, where it uses the OAuth 2.0
  client-credentials grant with RFC 6750 bearer tokens. It is an MCP client, not an MCP server. No
  compliance certifications (SOC 2, ISO 27001, FedRAMP, IL4/IL5) are published on any public
  Striveworks surface, so no Compliance pointer is emitted.
standards:
  - id: oauth2-client-credentials
    name: OAuth 2.0 client credentials grant (RFC 6749 §4.4)
    conforms: true
    evidence: >-
      POST /auth/client/v2/chariot/login with client_id, client_secret and grant_type=client_credentials
      as application/x-www-form-urlencoded; response carries access_token and expires_in.
    source: https://production.chariot.striveworks.us/docs/user_guide/administration/authentication
  - id: rfc6750-bearer
    name: OAuth 2.0 Bearer Token Usage (RFC 6750)
    conforms: true
    evidence: 'Authorization: Bearer <access_token> header required on all API requests; anonymous requests return 401 {"error":"invalid bearer token"}.'
    source: https://production.chariot.striveworks.us/docs/user_guide/administration/authentication
  - id: rfc8414-oauth-metadata
    name: OAuth 2.0 Authorization Server Metadata (RFC 8414)
    conforms: false
    evidence: '/.well-known/oauth-authorization-server returned 404 on the observed Chariot instance.'
  - id: openid-connect-discovery
    name: OpenID Connect Discovery
    conforms: false
    evidence: '/.well-known/openid-configuration returned 404 on both striveworks.com and the observed Chariot instance.'
  - id: mutual-tls
    name: PKI / mutual-TLS client authentication
    conforms: true
    evidence: >-
      Documented PKCS#12 and separate certificate/key file authentication, usable with or without a
      bearer token, for environments that require PKI.
    source: https://production.chariot.striveworks.us/docs/user_guide/administration/authentication
  - id: kserve-v2-open-inference-protocol
    name: KServe v2 / Open Inference Protocol
    conforms: true
    evidence: >-
      chariot-v2-kserve is a Chariot-recognized Inference Protocol; documented request payloads use the
      Open Inference Protocol shape (inputs[] with name, shape, datatype, data, parameters).
    source: https://production.chariot.striveworks.us/docs/user_guide/deploy-models/inference-servers/inference-protocols
  - id: openai-compatible-api
    name: OpenAI-compatible inference API
    conforms: true
    evidence: >-
      openai-v1 and chariot-v1-openai are recognized Inference Protocols; token metrics are reported for
      models served through the OpenAI proxy engine and the Azure OpenAI inference engine.
    source: https://production.chariot.striveworks.us/docs/user_guide/deploy-models/inference-servers/inference-protocols
  - id: torchserve
    name: TorchServe inference protocol
    conforms: true
    evidence: chariot-v1-torchserve is a Chariot-recognized Inference Protocol.
    source: https://production.chariot.striveworks.us/docs/user_guide/deploy-models/inference-servers/inference-protocols
  - id: huggingface-hub
    name: Hugging Face Hub model import / inference
    conforms: true
    evidence: >-
      huggingface-hub-v1 is a recognized Inference Protocol; Chariot imports models from Hugging Face
      with a file-tree selector and revision pinning, and serves them via Transformers.
    source: https://production.chariot.striveworks.us/docs/user_guide/catalog-models/importing-models/huggingface/
  - id: mcp
    name: Model Context Protocol
    conforms: partial
    role: client
    evidence: >-
      Chariot consumes remote MCP servers through MCP Connections (transport streamable_http, endpoint,
