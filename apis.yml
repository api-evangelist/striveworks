aid: striveworks
name: Striveworks
description: >-
  Striveworks is an Austin, Texas enterprise AI operations (AIOps) company whose platform, Chariot, lets
  organizations build, deploy, monitor and continuously retrain machine-learning models — in hours rather
  than months — across cloud, on-premises, disconnected and edge environments. Chariot covers the full
  model lifecycle: dataset management and versioning, AI-assisted annotation, code-free and custom-code
  training, a model catalog with model cards and staging, evaluation and model comparison, inference
  servers and pluggable inference engines (vLLM, TorchServe, KServe v2, OpenAI-compatible and Hugging
  Face), an inference store for querying production predictions, drift detection and monitoring, and an
  alpha agentic-workflows framework that runs guard-railed AI agents wired to remote MCP servers.
  Programmatic access is through a per-tenant REST API secured with OAuth 2.0 client credentials, a
  first-party Python SDK (chariot-client) and the `chariot` CLI. Striveworks works heavily with US
  defense and federal customers, including US Army and US Navy AI programs.
