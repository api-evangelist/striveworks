apis:
- name: Chariot Platform API
  description: >-
    Per-tenant REST API for the Chariot AI operations platform, organized as versioned microservice
    paths under /api/{service}/{version}/ — identity, training, evaluation, notification, catalog,
    serve and mcp were confirmed on the Striveworks-operated instance. Authentication is OAuth 2.0
    client credentials (POST /auth/client/v2/chariot/login) returning a bearer token, with optional
    PKI/mutual-TLS for environments that require it. Authorization is role-based over organizations
    and projects. Striveworks publishes no OpenAPI: every /api/ route answers 401 to anonymous
    requests, so the machine-readable contract is behind the tenant credential.
  humanURL: https://production.chariot.striveworks.us/docs/
  baseURL: https://production.chariot.striveworks.us/api/
